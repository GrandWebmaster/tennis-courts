name: Обновление расписания

on:
  schedule:
    # Раз в два часа. Чаще просить смысла нет: GitHub выполняет расписание
    # по остаточному принципу и частые запуски всё равно пропускает — при
    # интервале в 15 минут реально проходило 3-5 в сутки. Возраст данных
    # показан на самой странице.
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
      - '**.md'

permissions:
  contents: write

# Два обновления разом только подрались бы за data.json.
concurrency:
  group: schedule-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать data.json
        run: python3 build/fetch.py

      - name: Закоммитить, если расписание изменилось
        run: |
          if git diff --quiet -- data.json; then
            echo "свободные слоты те же, коммит не нужен"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git commit -m "обновление расписания"
          git push
