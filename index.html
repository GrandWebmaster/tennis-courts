<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Свободные корты — Городской теннисный центр «Проспект», Рыбинск</title>
<meta name="description" content="Какие теннисные корты свободны в ближайшие дни. Обновляется автоматически.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23d8f34a'/><path d='M6 7q10 9 0 18M26 7q-10 9 0 18' stroke='%230d1f2d' stroke-width='2' fill='none'/></svg>">
</head>
<body>

<div class="floodlight" aria-hidden="true"></div>

<header class="masthead">
    <div class="masthead-inner">
        <p class="eyebrow">Рыбинск, пр-т Серова, 23</p>
        <h1>Свободные<br><span class="accent">корты</span></h1>
        <p class="lede">
            Закрытые корты с покрытием хард, №1&#8202;–&#8202;3.
            Цветная клетка — свободное время, цифра в ней — номер корта.
        </p>
    </div>
</header>

<main>
    <div class="panel">
        <div class="controls">
            <div class="segmented" id="durations" role="group" aria-label="Длительность аренды"></div>
            <p class="stamp" id="stamp"></p>
        </div>

        <p class="notice" id="notice" hidden></p>

        <div class="court" id="court">
            <p class="loading">Загружаем расписание…</p>
        </div>
    </div>

    <footer class="legend">
        <p class="legend-row" id="legend"></p>
        <p class="fineprint">
            Цена зависит от времени и дня недели, она в подсказке к цифре.
            Бронь оформляется на стороне сервиса записи центра.
        </p>
    </footer>
</main>

<script src="assets/app.js?v=1" defer></script>
</body>
</html>
